<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وصلت — تم النقل</title>
<script>
(function(){
  var TARGET = "https://weslat.vercel.app";
  var h = (location.hash || "").toLowerCase();
  var p = "";
  if (h.indexOf("admin") > -1) p = "/admin";
  else if (h.indexOf("staff") > -1) p = "/staff";
  else if (h.indexOf("join") > -1) p = "/join";
  location.replace(TARGET + p);
})();
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:3rem 1rem;background:#F4F6FB;color:#0B1220">
  <h2 style="font-size:1.2rem;margin-bottom:.5rem">وصلت — تم نقل الموقع</h2>
  <p>إذا ما تحولت تلقائياً، اضغط الرابط الجديد:</p>
  <p><a href="https://weslat-survey.vercel.app">weslat-survey.vercel.app</a></p>
</body>
</html>
